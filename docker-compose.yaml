services:
  search-service:
    build: .
    volumes:
      - ./centinela_logs:/centinela_logs
      - .:/app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_HOST=${NEO4J_HOST}
      - NEO4J_PORT=${NEO4J_PORT}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - MONGO_DB_USERNAME=${MONGO_DB_USERNAME}
      - MONGO_DB_PASSWORD=${MONGO_DB_PASSWORD}
      - MONGO_DB_HOST=${MONGO_DB_HOST}
      - MONGO_DB_PORT=${MONGO_DB_PORT}
      - ADMIN_CENTINELA=${ADMIN_CENTINELA}
      - PASSWORD_CENTINELA=${PASSWORD_CENTINELA}
      # Ollama daemon lives in rag-service compose (container name: ollama) on centinela-net
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_QA_MODEL=${OLLAMA_QA_MODEL:-qwen2.5:1.5b}
      - OLLAMA_HYDE_MODEL=${OLLAMA_HYDE_MODEL:-qwen2.5:1.5b}
    depends_on:
      search-neo4j:
        condition: service_healthy
      search-mongo:
        condition: service_healthy
    networks:
      centinela-net:
        aliases:
          - search-service

  search-neo4j:
    image: neo4j:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - ./neo4j_db/data:/data
      - ./neo4j_db/logs:/logs
      - ./neo4j_db/import:/var/lib/neo4j/import
      - ./neo4j_db/plugins:/plugins
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/7687"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - centinela-net

  search-mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_DB_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_DB_PASSWORD}
    volumes:
      - ./mongo_db/data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - centinela-net

networks:
  centinela-net:
    external: true
